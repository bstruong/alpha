# =============================================================================
# /etc/systemd/system/user@.service.d/memlock.conf
# hybrid-ai-harness local AI engine (Workstation) - Systemd user manager drop-in
# =============================================================================
# Systemd user services (systemctl --user) do not inherit /etc/security/limits.d
# pam_limits.so settings unless configured at the user@.service manager level.
# This drop-in allows user systemd units (such as berserker-llama.service)
# to lock unlimited memory into RAM.
#
# Install with:
#   sudo mkdir -p /etc/systemd/system/user@.service.d/
#   sudo cp engine/system/user@.service.d/memlock.conf /etc/systemd/system/user@.service.d/
#   sudo systemctl daemon-reload
#
# Verification:
#   systemctl --user daemon-reexec
#   systemctl --user show -p DefaultLimitMEMLOCK
#   (Expected output: DefaultLimitMEMLOCK=infinity or 18446744073709551615)
# =============================================================================

[Service]
LimitMEMLOCK=infinity
