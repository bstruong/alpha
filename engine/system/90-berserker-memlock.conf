# =============================================================================
# /etc/security/limits.d/90-berserker-memlock.conf
# Berserker local AI engine (Metrotower) - PAM memlock configuration
# =============================================================================
# Grants user 'brian' permission to lock unlimited physical memory into RAM.
# Required for llama-server --load-mode mlock to prevent routed expert weights
# (~19.5 GB) from being paged out to swap under system memory pressure.
#
# Install with:
#   sudo cp engine/system/90-berserker-memlock.conf /etc/security/limits.d/
#
# Verification:
#   Log out and log back in (or open a new PAM session), then run:
#   ulimit -l
#   (Expected output: unlimited)
# =============================================================================

brian    soft    memlock    unlimited
brian    hard    memlock    unlimited
