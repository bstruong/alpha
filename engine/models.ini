; =============================================================================
; berserker / engine / models.ini  —  llama-server presets for METROTOWER
; =============================================================================
; Hardware: Ryzen 7 9700X (8C/16T, 1 CCD, 32 MiB L3) | RTX 3060 12 GB (headless:
; display runs on the Ryzen iGPU, card1/DP-2) | 32 GB DDR5-6000 CL36 2x16 |
; Samsung 990 Pro (Btrfs, zstd:3) | llama.cpp CUDA build 4d756bc+ (qwen4exp).
; System package b10631 is superseded via LLAMA_SERVER_BIN in metrotower.env.
;
; Used two ways (one source of truth, no duplicated flags):
;   1. Router mode:  llama-server --models-preset engine/models.ini --models-max 1
;   2. Single mode:  engine/bin/llama-up.sh single <section>
;      (engine/bin/ini2args.py flattens [*] + [<section>] into CLI flags)
;
; Keys are llama-server long flags without the leading "--". Boolean flags take
; "true". Values below are starting points. Phase 4 (validation/) decides
; what gets promoted. Every non-obvious value has a "why" comment.
;
; ---- Flag-name mapping vs. the original spec --------------------------------
;   --no-mmap --mlock   ->  load-mode = mlock   (b10631 deprecates the two old
;                           flags in favour of --load-mode; "mlock" = read into
;                           RAM without mmap, then lock it).
;   "TurboQuant KV"     ->  NOT AVAILABLE in this build. b10631 only accepts
;                           f32,f16,bf16,q8_0,q4_0,q4_1,iq4_nl,q5_0,q5_1 for
;                           -ctk/-ctv. We use q8_0. You don't need TurboQuant to
;                           reach 256k on Qwen3.6 (see KV math below). See
;                           engine/README.md for the optional fork path.
; =============================================================================

version = 1

; -----------------------------------------------------------------------------
; Global defaults (inherited by every preset)
; -----------------------------------------------------------------------------
[*]
; 7 generation threads on 7 physical cores. One core plus all SMT siblings stay
; free for KWin/Wayland, the CUDA dispatch thread and the HTTP threads.
; CPU expert matmuls are memory-bandwidth bound: on a single-CCD Zen 5 the
; Infinity Fabric read ceiling is ~60-65 GB/s, so SMT threads add contention
; but no bandwidth.
threads = 7
threads-batch = 7

; Full offload of all *non-expert* tensors (attention / SSM / shared experts /
; output head). Placement of the routed experts is decided per preset.
n-gpu-layers = all
flash-attn = on

; Load straight into RAM (no mmap), then mlock. Needs RLIMIT_MEMLOCK raised,
; see engine/system/. If memlock is still 8 MiB (the current default on
; Metrotower) the lock fails with only a warning.
load-mode = mlock

; Prefill: bigger physical batches mean fewer PCIe uploads of CPU-resident
; expert weights during op-offload (prompt processing runs on the GPU).
batch-size = 2048
ubatch-size = 2048

; KV cache: 8-bit K and V. Quantized V requires flash-attn (set above).
cache-type-k = q8_0
cache-type-v = q8_0

; Prompt cache + 256-token chunk reuse via KV shifting.
; NOTE: KV shifting is only possible for pure-attention models (GLM preset).
; On hybrid/recurrent models (Qwen3.6) llama.cpp falls back to context
; checkpoints. Check the startup log for the "cache_reuse" message.
cache-prompt = true
cache-reuse = 256

; Host-RAM prompt cache. The default (8192 MiB) is unaffordable here: the expert
; weights alone take ~20 GB of the 32 GB.
cache-ram = 2048

; Two slots in one unified KV pool: the interactive agent and the n8n
; background batch don't evict each other's prefix. The context pool is shared.
parallel = 2
kv-unified = true

; Server hygiene.
host = 127.0.0.1
jinja = true
metrics = true
slots = true
; Required for POST /slots/{id}?action=erase (benchmark harness resets KV between modules).
slot-save-path = /home/brian/Projects/berserker/engine/run/slots
context-shift = false
; Keep 1 GiB VRAM headroom (fit step + CUDA allocator). The display no longer
; lives on the 3060 (see opencode-agent-eval/README.md, 640x480 incident), so
; the old 4 GiB Ollama margin isn't needed.
fit-target = 1024

; ---- Anti-loop defaults (server-side, so they apply to harnesses that ignore
; ---- our client guardrails, e.g. Pi / opencode / n8n)
; Hard cap on native <think> tokens. Past the budget the message below is
; injected and the model must answer. Evidence: experiments/rate_limiter/
; qwen_benchmark_metrics.json shows a 12,288-token degenerate loop with 0
; content tokens in 280 s with no budget. The bounded run passed in 5.9 s.
reasoning-budget = 2048
reasoning-budget-message = Thinking budget exhausted. Stop deliberating and produce the final answer now.
; Code-safe sampling. repeat-penalty MUST stay 1.0 for code: the running server
; uses 1.1, which penalises legitimately repeated tokens (braces, indentation,
; identifiers).
repeat-penalty = 1.0
min-p = 0.0
top-k = 20
top-p = 0.95
temp = 0.6

; -----------------------------------------------------------------------------
; [qwen36-coder]  DEFAULT daily coding engine (matches the spec: all experts in RAM)
; -----------------------------------------------------------------------------
; Arch qwen35moe: 40 blocks, full_attention_interval=4, so only 10 layers have a
; KV cache (the other 30 are Gated-DeltaNet recurrent state, ~63 MiB per slot).
; KV/token = 10 layers x 2 (K,V) x 2 kv-heads x 256 dim x bytes
;          = 20 KiB (f16) | ~10.6 KiB (q8_0) | ~5.6 KiB (q4_0)
; 262,144 ctx = 5.0 GiB f16 | 2.66 GiB q8_0 | 1.41 GiB q4_0
; So the full native 256k context fits in VRAM at q8_0 with no exotic KV codec.
[qwen36-coder]
model = /home/brian/Projects/berserker/experiments/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
alias = qwen36-coder
ctx-size = 262144
; All 40x256 routed experts (~19.5 GB at UD-Q4_K_M) live in DDR5. Attention, SSM
; and shared experts live on the 3060.
cpu-moe = true
; Hybrid model: context checkpoints replace KV shifting for prefix reuse. Each
; checkpoint is ~63 MiB of recurrent state. 8 of them = ~0.5 GiB host RAM.
ctx-checkpoints = 8
checkpoint-min-step = 2048

; -----------------------------------------------------------------------------
; [qwen36-coder-hybrid]  CANDIDATE: spill free VRAM into expert layers
; -----------------------------------------------------------------------------
; Moving the KV cache from f16 to q8_0 frees ~2.3 GiB of VRAM vs. today's server.
; We spend it on the routed experts of the last 8 layers (~0.49 GB/layer):
;  - ~20% fewer bytes streamed from DDR5 per token (decode is bandwidth-bound)
;  - ~3.9 GB less pinned host RAM (the box is already 8.8 GB into swap)
; Promote to default only if validation/run_suite.py perf+soak gates pass.
; Sweep range: n-cpu-moe 30..34.
[qwen36-coder-hybrid]
model = /home/brian/Projects/berserker/experiments/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
alias = qwen36-coder-hybrid
ctx-size = 262144
n-cpu-moe = 32
ctx-checkpoints = 8
checkpoint-min-step = 2048

; -----------------------------------------------------------------------------
; [glm47-reap]  REAP-pruned alternative (25% of experts removed), lighter on RAM
; -----------------------------------------------------------------------------
; Arch deepseek2 (MLA): 47 blocks, kv_lora_rank 512 + rope 64 = 576-wide latent.
; KV/token ~= 47 x 576 x 1.0625 B ~= 28 KiB (q8_0, V as a view of K under FA).
; 131,072 ctx ~= 3.6 GiB q8_0. Up to ~7.5 GiB if the build stores V separately.
; Read "llama_kv_cache: size =" in the log before raising ctx.
; Pure attention, so cache-reuse 256 (KV shifting) is effective here.
; ~6.5 GB less DDR5 than Qwen3.6: the right pick when the Docker stack is busy.
[glm47-reap]
model = /home/brian/Projects/berserker/experiments/models/GLM-4.7-Flash-REAP-23B-A3B-Q4_K_M.gguf
alias = glm47-reap
ctx-size = 131072
cpu-moe = true
[qwen3.8-flash]
alias = qwen-3.8-flash
model = /home/brian/Projects/berserker/models/Qwen3.8-Flash-Next-AD-3.84bpw-IQ4_XS-M64/Qwen3.8-Flash-Next-AD-3.84bpw-IQ4_XS-M64-00001-of-00028.gguf
; PLE/n-gram table (~51B) is gather-only — keep on CPU and page via mmap (qwen4exp recipe).
load-mode = mmap
override-tensor = per_layer_token_embd=CPU
n-cpu-moe = 56
; One slot: qwen4exp indexer is not safe at parallel>1; also halves KV footprint.
parallel = 1
; Cover the 64k telemetry point + chat template overhead; avoid allocating full 256k KV.
ctx-size = 69632
threads = 7
threads-batch = 7
ubatch-size = 2048
batch-size = 2048
; A/B 2026-10-07 (mmap, 3 runs, temp 0): ngram-mod 2.90 / 5.52 tok/s vs none 3.27 / 5.46
; (code / repetition prompts). Drafts were accepted (78-100%) but gave no speedup: decode is
; bound by expert paging from NVMe, not verification. none = simpler + stabler for benchmarks.
spec-type = none
cache-reuse = 256
cache-type-k = q4_0
cache-type-v = q4_0
kv-unified = false

